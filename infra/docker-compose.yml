version: '3.9'

services:
  # ── PostgreSQL 16 + TimescaleDB ──────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ff_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ff_user
      POSTGRES_PASSWORD: ff_pass
      POSTGRES_DB: financiallyfree
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ff_user -d financiallyfree']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 (BullMQ + Caching) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ff_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS API ────────────────────────────────────────────────────────
  api:
    build:
      context: ../
      dockerfile: apps/api/Dockerfile
    container_name: ff_api
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_HOST: postgres
      REDIS_HOST: redis
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Next.js Web ───────────────────────────────────────────────────────
  web:
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
    container_name: ff_web
    restart: unless-stopped
    env_file: ../.env
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
