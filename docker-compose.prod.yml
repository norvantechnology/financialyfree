version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# FinanciallyFree — Production Compose Orchestration
# Strictly environment-variable driven (zero hardcoded secrets)
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL 16 + TimescaleDB ───────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ff_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ff_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided}
      POSTGRES_DB: ${POSTGRES_DB:-financiallyfree}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ff_user} -d ${POSTGRES_DB:-financiallyfree}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  # ── Redis 7 (BullMQ & Cache) ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ff_redis_prod
    restart: always
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-}"
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  # ── NestJS API Backend (Non-Root User) ─────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ff_api_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-ff_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DATABASE_NAME: ${POSTGRES_DB:-financiallyfree}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      COOKIE_SECRET: ${COOKIE_SECRET:-prod_secure_cookie_secret_001}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      USE_MOCK_MF_EXECUTION: ${USE_MOCK_MF_EXECUTION:-true}
      USE_MOCK_KYC: ${USE_MOCK_KYC:-true}
      USE_MOCK_PAYMENTS: ${USE_MOCK_PAYMENTS:-true}
      USE_MOCK_MESSAGING: ${USE_MOCK_MESSAGING:-true}
      USE_MOCK_VIDEO: ${USE_MOCK_VIDEO:-true}
      USE_MOCK_MARKET_DATA: ${USE_MOCK_MARKET_DATA:-true}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      BSE_STAR_MEMBER_ID: ${BSE_STAR_MEMBER_ID:-}
      BSE_STAR_PASSWORD: ${BSE_STAR_PASSWORD:-}
      BSE_STAR_USER_ID: ${BSE_STAR_USER_ID:-}
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  # ── Next.js Web Frontend (Non-Root User) ──────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
        NEXT_PUBLIC_FEATURE_TRACK_B_ENABLED: ${NEXT_PUBLIC_FEATURE_TRACK_B_ENABLED:-false}
    container_name: ff_web_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-default_prod_nextauth_secret_ff}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

volumes:
  postgres_prod_data:
  redis_prod_data:
