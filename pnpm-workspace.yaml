packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@nestjs/core': true
  argon2: true
  msgpackr-extract: true
  unrs-resolver: true
overrides:
  next: '>=14.2.35'
  postcss: '>=8.5.18'
  js-yaml: '>=4.3.1'
  multer: '>=1.4.5-lts.1'
  lodash: '>=4.17.21'
  minimatch: '>=9.0.5'
  picomatch: '>=4.0.2'
  tmp: '>=0.2.6'


